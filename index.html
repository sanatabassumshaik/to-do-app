<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A simple and interactive To-Do List application built with JavaScript.">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="app-header">

        <div class="container">

            <h1>My To-Do List</h1>

            <p>
                Organize your tasks and stay productive.
            </p>

        </div>

    </header>


    <!-- =========================================
         MAIN APPLICATION
    ========================================== -->

    <main class="container">

        <section
            class="todo-app"
            aria-labelledby="todo-title">

            <h2 id="todo-title">
                Task Manager
            </h2>


            <!-- =================================
                 ADD TASK FORM
            ================================== -->

            <form
                id="task-form"
                class="task-form">

                <div class="input-group">

                    <label
                        for="task-input">
                        Add a new task
                    </label>

                    <input
                        type="text"
                        id="task-input"
                        name="task"
                        placeholder="What do you need to do?"
                        autocomplete="off"
                        required>

                </div>

                <button
                    type="submit"
                    class="add-button">
                    Add Task
                </button>

            </form>


            <!-- =================================
                 FILTERS
            ================================== -->

            <div
                class="filters"
                aria-label="Task filters">

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all">
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="active">
                    Active
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="completed">
                    Completed
                </button>

            </div>


            <!-- =================================
                 TASK LIST
            ================================== -->

            <section
                class="task-section"
                aria-labelledby="task-list-title">

                <h3 id="task-list-title">
                    Your Tasks
                </h3>

                <ul
                    id="task-list"
                    class="task-list"
                    aria-live="polite">
                </ul>

                <p
                    id="empty-message"
                    class="empty-message">
                    No tasks yet. Add your first task!
                </p>

            </section>


            <!-- =================================
                 TASK SUMMARY
            ================================== -->

            <footer class="task-footer">

                <p>
                    <span id="task-count">0</span>
                    tasks remaining
                </p>

                <button
                    type="button"
                    id="clear-completed"
                    class="clear-button">
                    Clear Completed
                </button>

            </footer>

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/script.js"></script>

</body>

</html>
